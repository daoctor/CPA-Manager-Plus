name: Fork Image

# Dispatchable preview publisher on default branch. The feature branch keeps
# its existing push/PR workflow unchanged.
run-name: Fork Image preview ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA at feat/request-log-viewer HEAD
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: cpa-preview-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/daoctor/cpa-manager-plus
  TARGET_REF: refs/heads/feat/request-log-viewer

jobs:
  docker:
    name: Build and publish preview image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate SHA and checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Confirm source is current feature branch HEAD
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Expected a full 40-character commit SHA"
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != "daoctor/CPA-Manager-Plus" ]]; then
            echo "::error::Unexpected repository"
            exit 1
          fi
          current="$(git ls-remote origin "$TARGET_REF" | awk '{print $1}')"
          if [[ "$current" != "$SOURCE_SHA" || "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::Source SHA is not the current feat/request-log-viewer HEAD; refusing preview tag update"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push preview image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.manager-server
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:preview
            ${{ env.IMAGE_NAME }}:sha-${{ inputs.source_sha }}
          build-args: |
            VERSION=preview
            SOURCE_COMMIT=${{ inputs.source_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
