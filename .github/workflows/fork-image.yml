name: Fork Image
run-name: "Fork Image preview ${{ inputs.source_sha }}"

# This default-branch dispatch entrypoint publishes the *feature-branch SHA*.
# The original fork-image.yml on feat/request-log-viewer is left unchanged.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Complete feature-branch merge commit SHA (40 hex characters)"
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: cpa-manager-plus-preview-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/daoctor/cpa-manager-plus
  TARGET_BRANCH: feat/request-log-viewer

jobs:
  docker:
    name: Build and publish feature preview
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout requested feature commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate SHA is current feature branch HEAD
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "daoctor/CPA-Manager-Plus" ]] || { echo "::error::Wrong repository"; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Invalid full SHA"; exit 1; }
          actual="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          [[ -n "$actual" && "$actual" == "$SOURCE_SHA" && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || {
            echo "::error::Requested commit is not current feature HEAD"; exit 1;
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Refuse to overwrite an existing SHA tag
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:sha-$SOURCE_SHA" >/dev/null 2>&1; then
            echo "::error::SHA tag already exists. Refusing to overwrite it; inspect the previous publication."
            exit 1
          fi

      - name: Build and push immutable-by-convention SHA image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.manager-server
          push: true
          tags: ghcr.io/daoctor/cpa-manager-plus:sha-${{ inputs.source_sha }}
          build-args: |
            VERSION=preview
            SOURCE_COMMIT=${{ inputs.source_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote SHA image to preview only if branch is unchanged
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          [[ "$actual" == "$SOURCE_SHA" ]] || {
            echo "::error::Feature branch advanced during build; refusing to move preview tag."
            exit 1
          }
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE:preview" "$IMAGE:sha-$SOURCE_SHA"

      - name: Verify real GHCR digests and push
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          fixed="$(docker buildx imagetools inspect "$IMAGE:sha-$SOURCE_SHA" --format '{{.Manifest.Digest}}')"
          moving="$(docker buildx imagetools inspect "$IMAGE:preview" --format '{{.Manifest.Digest}}')"
          [[ "$fixed" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Missing GHCR SHA digest"; exit 1; }
          [[ "$moving" == "$fixed" && "$BUILD_DIGEST" == "$fixed" ]] || {
            echo "::error::Build digest, preview tag, and SHA tag differ"; exit 1;
          }
          echo "Verified both published tags at digest $fixed"
          echo "SHA tag: $IMAGE:sha-$SOURCE_SHA"
          echo "Preview tag: $IMAGE:preview"
