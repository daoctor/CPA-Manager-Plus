name: CPA Manager Plus - Upstream Stable Sync
run-name: "Stable upstream sync to feat/request-log-viewer"

on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Singapore, UTC+08:00 year-round
  workflow_dispatch:

# Only modifies the feature branch; never merges PR #1 or pushes to main.
permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: cpa-manager-plus-upstream-stable-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Check, merge, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TARGET: feat/request-log-viewer
      UPSTREAM_URL: https://github.com/seakee/CPA-Manager-Plus.git
      ANCHOR_SHA: 64ce94e6aa1af691555429a3211e67c59c0480ad
      IMAGE: ghcr.io/daoctor/cpa-manager-plus
    steps:
      - name: Checkout current feature branch without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/request-log-viewer
          fetch-depth: 0
          persist-credentials: false

      - name: Check upstream main, release notes, and high-risk changes
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "daoctor/CPA-Manager-Plus" ]] || { echo "::error::Unexpected repository"; exit 1; }
          old_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)"
          [[ -n "$remote_sha" && "$old_sha" == "$remote_sha" ]] || { echo "::error::Feature branch changed during checkout"; exit 1; }
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream refs/heads/main
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          echo "old_sha=$old_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          # Validate ancestry using live refs, never the historical anchor as the current tip.
          git merge-base --is-ancestor "$ANCHOR_SHA" "$old_sha" || { echo "::error::Expected baseline missing from fork history"; exit 1; }
          git merge-base --is-ancestor "$ANCHOR_SHA" "$upstream_sha" || { echo "::error::Upstream main appears to have rewritten history"; exit 1; }

          if git merge-base --is-ancestor "$upstream_sha" "$old_sha"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream main commits to synchronize. No notification or image build."
            exit 0
          fi

          base="$(git merge-base "$old_sha" "$upstream_sha")"
          [[ -n "$base" ]] || { echo "::error::No common ancestry"; exit 1; }
          count="$(git rev-list --count "$old_sha..$upstream_sha")"
          [[ "$count" =~ ^[0-9]+$ && "$count" -gt 0 ]] || { echo "::error::Unexpected upstream history"; exit 1; }
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          echo "commit_count=$count" >> "$GITHUB_OUTPUT"
          echo "Upstream $upstream_sha adds $count commits."

          # Only upstream stable main. Latest release is informational and also a
          # machine-readable migration/breaking-change safety signal.
          release="$(curl --fail --location --silent --show-error --retry 3 \
            https://api.github.com/repos/seakee/CPA-Manager-Plus/releases/latest)"
          version="$(jq -r '.tag_name // ""' <<<"$release")"
          [[ -n "$version" && "$(jq -r '.draft' <<<"$release")" == "false" && "$(jq -r '.prerelease' <<<"$release")" == "false" ]] || {
            echo "::error::Cannot verify latest stable release"; exit 1;
          }
          echo "release=$version" >> "$GITHUB_OUTPUT"
          notes="$(jq -r '.body // ""' <<<"$release")"
          if grep -Eq '"(breaking|migration_required)"[[:space:]]*:[[:space:]]*true' <<<"$notes"; then
            echo "::error::Release requires breaking changes or migration; manual review required"
            exit 1
          fi

          git -c core.quotepath=off diff --name-only --no-renames "$base" "$upstream_sha" > "$RUNNER_TEMP/upstream-files.txt"
          git -c core.quotepath=off diff --name-only --no-renames "$base" "$old_sha" > "$RUNNER_TEMP/fork-files.txt"
          echo "Upstream changed paths:"
          cat "$RUNNER_TEMP/upstream-files.txt"

          # Fail closed on infrastructure, API/configuration, database, dependencies
          # and workflow changes that could demand operator action.
          if grep -Ei '(^|/)(migrations?|schema|database)(/|[._-])|(^|/)(Dockerfile[^/]*|docker-compose[^/]*|compose[.]ya?ml)$|(^|/)([.]env[^/]*|config[.][^/]*)$|(^|/)[.]github/workflows/|(^|/)(package(-lock)?[.]json|go[.]mod|go[.]sum|pnpm-lock[.]yaml)$|^apps/manager-server/' "$RUNNER_TEMP/upstream-files.txt"; then
            echo "::error::Risk-sensitive upstream files changed. Require manual compatibility review before any push."
            exit 1
          fi

          comm -12 <(LC_ALL=C sort "$RUNNER_TEMP/upstream-files.txt") <(LC_ALL=C sort "$RUNNER_TEMP/fork-files.txt") > "$RUNNER_TEMP/overlap.txt"
          echo "Fork/upstream overlapping paths:"
          cat "$RUNNER_TEMP/overlap.txt"
          while IFS= read -r shared; do
            [[ -n "$shared" ]] || continue
            # The known monitoring row overlap may merge only if the requestId
            # field is retained and all upstream/fork regression tests pass.
            if [[ "$shared" != "apps/web/src/features/monitoring/model/eventRows.ts" ]]; then
              echo "::error::Upstream touches fork-customized path: $shared"
              exit 1
            fi
          done < "$RUNNER_TEMP/overlap.txt"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create real merge commit and protect fork customizations
        if: steps.inspect.outputs.changed == 'true'
        id: merge
        env:
          OLD_SHA: ${ steps.inspect.outputs.old_sha }}
          UPSTREAM_SHA: ${ steps.inspect.outputs.upstream_sha }}
          MERGE_BASE: ${ steps.inspect.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit "$UPSTREAM_SHA" || {
            echo "::error::Real Git merge failed (conflict); no remote modifications were attempted."
            exit 1
          }
          read -r merged_sha first_parent second_parent < <(git rev-list --parents -n 1 HEAD)
          [[ "$first_parent" == "$OLD_SHA" && "$second_parent" == "$UPSTREAM_SHA" ]] || {
            echo "::error::Merge commit lacks required original parents"; exit 1;
          }
          git diff --check "$OLD_SHA" HEAD

          # Every fork-added file must retain its exact contents. Do not
          # silently replace Request Log parser, tests, or fork workflow.
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            if ! git cat-file -e "HEAD:$file" || ! git diff --quiet "$OLD_SHA" HEAD -- "$file"; then
              echo "::error::Fork-added file altered or removed: $file"
              exit 1
            fi
          done < <(git diff --diff-filter=A --name-only --no-renames "$MERGE_BASE" "$OLD_SHA")

          # The fork-owned viewer and Claude SSE parser are non-negotiable.
          protected=(
            ".github/workflows/fork-image.yml"
            "apps/web/src/features/monitoring/components/RealtimeEventsPanel.tsx"
            "apps/web/src/features/monitoring/components/RequestLogModal.tsx"
            "apps/web/src/features/monitoring/components/RequestLogModal.module.scss"
            "apps/web/src/features/monitoring/components/requestLogParser.ts"
            "apps/web/src/features/monitoring/components/requestLogParser.test.ts"
          )
          for file in "${protected[@]}"; do
            git cat-file -e "HEAD:$file" || { echo "::error::Custom file disappeared: $file"; exit 1; }
            git diff --quiet "$OLD_SHA" HEAD -- "$file" || {
              echo "::error::Custom feature altered: $file"; exit 1;
            }
          done

          grep -Fq 'requestId: readString(detail.__requestId) || undefined,' \
            apps/web/src/features/monitoring/model/eventRows.ts || {
            echo "::error::Fork Request Log row identity was not preserved"; exit 1;
          }
          echo "merged_sha=$merged_sha" >> "$GITHUB_OUTPUT"
          echo "Safe candidate merge commit: $merged_sha"
          git status --short

      - name: Set up Node.js 24
        if: steps.inspect.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: TypeScript, ESLint, frontend tests, bundle build, and checks
        if: steps.inspect.outputs.changed == 'true'
        id: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run type-check
          npm run lint
          npm test
          VERSION=ci npm --workspace apps/web run build:bundle
          npm run check:demo-isolation
          npm run check:web-icons

      - name: Set up Go 1.24
        if: steps.inspect.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: apps/manager-server/go.sum

      - name: Manager Server tests
        if: steps.inspect.outputs.changed == 'true'
        id: manager
        working-directory: apps/manager-server
        run: go test ./...

      - name: Validate Docker Compose configuration
        if: steps.inspect.outputs.changed == 'true'
        run: docker compose -f docker-compose.manager.yml config

      - name: Set up Docker Buildx
        if: steps.inspect.outputs.changed == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image without push (pre-push CI)
        if: steps.inspect.outputs.changed == 'true'
        id: docker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.manager-server
          push: false
          tags: cpa-manager-plus:upstream-merge-ci
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Recheck both remote SHAs and push without force
        if: steps.inspect.outputs.changed == 'true'
        id: push
        env:
          GH_TOKEN: ${ github.token }}
          OLD_SHA: ${ steps.inspect.outputs.old_sha }}
          UPSTREAM_SHA: ${ steps.inspect.outputs.upstream_sha }}
          MERGED_SHA: ${ steps.merge.outputs.merged_sha }}
        shell: bash
        run: |
          set -euo pipefail
          latest_upstream="$(git ls-remote "$UPSTREAM_URL" refs/heads/main | cut -f1)"
          latest_fork="$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)"
          [[ "$latest_upstream" == "$UPSTREAM_SHA" && "$latest_fork" == "$OLD_SHA" ]] || {
            echo "::error::Upstream or fork HEAD moved while testing. No push was attempted."
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$MERGED_SHA" ]] || {
            echo "::error::Merged commit changed unexpectedly"; exit 1;
          }
          gh auth setup-git
          git push origin "HEAD:refs/heads/$TARGET"
          new_remote="$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)"
          [[ "$new_remote" == "$MERGED_SHA" ]] || { echo "::error::Remote SHA not equal to merged commit"; exit 1; }
          echo "new_sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"

      - name: Explicitly dispatch existing fork-image.yml publisher on main
        if: steps.push.outputs.new_sha != ''
        id: dispatch
        env:
          GH_TOKEN: ${ github.token }}
          NEW_SHA: ${ steps.push.outputs.new_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run fork-image.yml -R "$GITHUB_REPOSITORY" --ref main -f "source_sha=$NEW_SHA"
          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Wait for real Docker publish, GHCR digest checks and conclusion
        if: steps.dispatch.outputs.started == 'true'
        id: verify
        env:
          GH_TOKEN: ${ github.token }}
          NEW_SHA: ${ steps.push.outputs.new_sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 45); do
            run_id="$(gh run list -R "$GITHUB_REPOSITORY" \
              --workflow fork-image.yml --event workflow_dispatch --limit 60 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"Fork Image preview $NEW_SHA\") | .databaseId" | head -n 1)"
            if [[ -n "$run_id" ]]; then break; fi
            sleep 10
          done
          [[ -n "$run_id" ]] || { echo "::error::Publisher run was not created or could not be found"; exit 1; }
          echo "publish_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_OUTPUT"
          echo "Publisher: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          timeout 5400 gh run watch "$run_id" -R "$GITHUB_REPOSITORY" --exit-status
          gh run view "$run_id" -R "$GITHUB_REPOSITORY" --json status,conclusion \
            --jq 'if .status == "completed" and .conclusion == "success" then "Publisher and GHCR digest verification passed" else error("Publisher failed") end'

      - name: Notify successful sync via assigned GitHub Issue
        if: success() && steps.inspect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${ github.token }}
          NEW_SHA: ${ steps.push.outputs.new_sha }}
          UP_SHA: ${ steps.inspect.outputs.upstream_sha }}
          COUNT: ${ steps.inspect.outputs.commit_count }}
          VERSION: ${ steps.inspect.outputs.release }}
          PUBLISH_URL: ${ steps.verify.outputs.publish_url }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(gh api repos/seakee/CPA-Manager-Plus/releases/latest --jq .body | head -n 32)"
          body="$(printf 'Upstream stable main: %s (%s)\nNew commits synchronized: %s\nMerge conflicts: none; fork Request Log/Claude SSE customizations preserved.\nNew merge commit: %s\nCI: TypeScript PASS, ESLint PASS, frontend tests PASS, frontend build PASS, Manager Server tests PASS, Docker CI build PASS.\nGHCR: sha-%s and preview tags published and verified with matching real registry digests.\nImages:\n- %s:preview\n- %s:sha-%s\nBuild and GHCR verification run: %s\nSync workflow: https://github.com/%s/actions/runs/%s\n\nRelease notes / upgrade considerations:\n%s\n' "$VERSION" "$UP_SHA" "$COUNT" "$NEW_SHA" "$NEW_SHA" "$IMAGE" "$IMAGE" "$NEW_SHA" "$PUBLISH_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$notes")"
          gh issue create -R "$GITHUB_REPOSITORY" --assignee daoctor \
            --title "Upstream sync successful: $VERSION ($NEW_SHA)" \
            --body "$body" || echo "::warning::Could not post a success Issue; inspect this Actions run"

      - name: Notify failures via assigned GitHub Issue
        if: failure()
        env:
          GH_TOKEN: ${ github.token }}
          INSPECT: ${ steps.inspect.outcome }}
          MERGE: ${ steps.merge.outcome }}
          FRONTEND: ${ steps.frontend.outcome }}
          MANAGER: ${ steps.manager.outcome }}
          DOCKER: ${ steps.docker.outcome }}
          PUSH: ${ steps.push.outcome }}
          DISPATCH: ${ steps.dispatch.outcome }}
          VERIFY: ${ steps.verify.outcome }}
          OLD_SHA: ${ steps.inspect.outputs.old_sha }}
          UPSTREAM_SHA: ${ steps.inspect.outputs.upstream_sha }}
          NEW_SHA: ${ steps.push.outputs.new_sha }}
          PUBLISH_URL: ${ steps.verify.outputs.publish_url }}
        shell: bash
        run: |
          set -euo pipefail
          failed=""
          for entry in "inspect:$INSPECT" "merge:$MERGE" "frontend:$FRONTEND" "manager:$MANAGER" "docker:$DOCKER" "push:$PUSH" "dispatch:$DISPATCH" "verify:$VERIFY"; do
            [[ "$entry" != *":failure" ]] || failed="$failed $entry"
          done
          body="$(printf 'CPA upstream auto-sync stopped. Failing stages:%s\nUpstream main SHA: %s\nFeature SHA before run: %s\nNew feature SHA if already pushed: %s\nSafety: no force push, no main change, no PR #1 merge, no production deployment.\nCheck the exact failing step and error log:\nhttps://github.com/%s/actions/runs/%s\nPublisher run if dispatched: %s\nAction required: inspect the logs, review compatibility/conflicts or permissions, and retry via workflow_dispatch after resolving the issue.\n' "$failed" "$UPSTREAM_SHA" "$OLD_SHA" "$NEW_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$PUBLISH_URL")"
          gh issue create -R "$GITHUB_REPOSITORY" --assignee daoctor \
            --title "Upstream sync failed: Actions run $GITHUB_RUN_ID" \
            --body "$body" || echo "::warning::Issue notification failed; review this run"
